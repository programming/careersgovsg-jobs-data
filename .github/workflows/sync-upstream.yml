name: Sync upstream

# Keeps this fork's main in lock-step with opengovsg by merging upstream data
# commits, then triggers the SQLite warehouse rebuild. Upstream only commits
# under data/, and our tooling lives under sqlite/ + .github/, so merges are
# normally clean.

on:
  # Upstream commits data twice per weekday, ~03:10-03:30 and ~08:10-08:30 UTC
  # (cron '10 2,7 * * 1-5' plus ~30-35 min runtime). Sync ~50 min after each
  # cron so the day's commit has landed before we merge.
  schedule:
    - cron: '20 3,8 * * 1-5'
    # Daily catch-up for runs that were queued or finished late.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write   # push the merge to this fork
  actions: write    # dispatch the Build SQLite warehouse workflow

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this fork's main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/opengovsg/careersgovsg-jobs-data.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit upstream/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger warehouse rebuild
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-sqlite.yml --repo "$GITHUB_REPOSITORY"